# ========================================================
# NAS 智能管家 - 自动化定时任务与智能巡检配置 (YAML 规范)
# ========================================================
# 规则说明：
# 1. 每日定点任务：配置 `time: "HH:MM"` 与 `prompt: |` 即可。
# 2. 周期巡检任务：配置 `interval_minutes: 分钟数`。若配置了 `thresholds`，
#    则在未超标时静默比对（0 Token 消耗）；超标时唤醒大模型进行智能深度诊断；
#    恢复时通过 `notify_on_recovery: true` 自动发送绿色状态卡片形成闭环。
# ========================================================

# 1. 每日定点任务：生活与运维晨报
- name: "🌅 今日 SRE 运维与生活晨报"
  time: "08:00"                # 每日固定触发时间 (HH:MM)
  enabled: true
  prompt: |
    请先调用 get_weather_calendar 获取今日天气状况、温差、出行建议、农历节气及放假倒计时（距离周末/法定节假日），
    再综合分析宿主机健康状态、各容器运行状态，并检查常见备份容器（如 nas-backup、restic、duplicati 等，未部署则直接跳过）。
    输出一份精炼专业的晨报，分为【今日生活简报】【系统核心结论】【运行水位】【备份报告】【风险与建议】五段。
    在【今日生活简报】中注明放假倒计时，在【备份报告】中总结昨夜备份状态（未部署可注明无），语言专业生动，限 260 字以内。

# 2. 周期性任务：系统健康静默巡检与 AI 智能诊断
- name: "🔍 系统健康例行巡检与智能诊断"
  interval_minutes: 5          # 巡检间隔（分钟）
  enabled: true
  notify_on_recovery: true     # 故障恢复正常时，是否发送绿色闭环通知（0 Token 消耗）
  thresholds:                  # 告警触发阈值（本地快速比对，未超标时 0 Token 消耗，静默不打扰）
    cpu: 85                    # CPU 使用率百分比
    memory: 90                 # 内存使用率百分比
    disk: 95                   # 磁盘挂载点使用率百分比
    cpu_temp: 80               # CPU 温度（摄氏度）
  prompt: |
    系统检测到指标超标或容器异常。
    请结合当前异常告警项，调用相关工具排查具体原因（如定位高资源占用容器），
    给出专业的故障原因推测与应急处置建议，限 200 字以内。
