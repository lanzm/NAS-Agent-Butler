version: '3.8'

services:
  nas-agent-butler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nas-agent-butler
    restart: unless-stopped
    # 默认 bridge 网络；PC 电源管理需 WOL 广播时需单独评估网络配置。
    env_file:
      - .env
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - docker-api
    volumes:
      # 应用容器只访问同网络内的受限代理，不直接挂载宿主机 Docker socket。
      # 挂载宿主机系统信息目录（只读，用于提取准确的 CPU/负载与磁盘挂载数据）
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/localtime:/etc/localtime:ro
      # 挂载自定义定时任务配置（支持热更新）
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8999/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: nas-agent-butler-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  docker-api:
    internal: true
